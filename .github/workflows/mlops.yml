name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up DagsHub MLflow tracking (Bonus 1)
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Debug: show what secrets we received (masked)
          echo "=== DagsHub secrets debug ==="
          echo "DAGSHUB_USER length: ${#DAGSHUB_USER}"
          echo "DAGSHUB_TOKEN length: ${#DAGSHUB_TOKEN}"
          if [ -n "$DAGSHUB_USER" ]; then
            echo "DAGSHUB_USER first 3 chars: ${DAGSHUB_USER:0:3}..."
          else
            echo "DAGSHUB_USER is EMPTY"
          fi
          if [ -n "$DAGSHUB_TOKEN" ]; then
            echo "DAGSHUB_TOKEN first 4 chars: ${DAGSHUB_TOKEN:0:4}..."
          else
            echo "DAGSHUB_TOKEN is EMPTY"
          fi
          echo "=== End debug ==="
          echo ""
          echo "DAGSHUB_USER=${DAGSHUB_USER}" >> $GITHUB_ENV
          echo "DAGSHUB_TOKEN=${DAGSHUB_TOKEN}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${DAGSHUB_USER}/K3-Track2-Day21-CI-CD-for-AI-Systems-2A202601879-BuiGiaHuy.mlflow" >> $GITHUB_ENV
          echo "[Bonus 1] MLflow tracking URI set to DagsHub"
          echo "[Bonus 1] User: ${DAGSHUB_USER}"
          echo "[Bonus 1] URI:  ${MLFLOW_TRACKING_URI}"

      - name: Authenticate to Cloud Storage
        run: |
          echo "${{ secrets.CLOUD_CREDENTIALS_B64 }}" | base64 -d > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          echo "Decoded file size:"
          wc -c /tmp/sa-key.json

      - name: Debug credentials
        run: |
          echo "=== File size ==="
          wc -c /tmp/sa-key.json
          echo "=== First 80 chars ==="
          head -c 80 /tmp/sa-key.json
          echo ""
          echo "=== Last 80 chars ==="
          tail -c 80 /tmp/sa-key.json
          echo ""
          echo "=== Check for backslash-escaped quotes ==="
          grep -c '\\"' /tmp/sa-key.json || echo "no escaped quotes found"
          echo "=== Check JSON validity ==="
          python -c "import json; d=json.load(open('/tmp/sa-key.json')); print('JSON OK'); print('client_email:', d['client_email']); print('private_key starts:', d['private_key'][:30])"
          echo "=== Test gcloud auth ==="
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json 2>&1 | head -5
          echo "=== Test GCS list ==="
          gcloud storage ls gs://day21vin/ 2>&1 | head -5

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          from google.cloud import storage
          client = storage.Client()
          bucket = client.bucket("${{ secrets.CLOUD_BUCKET }}")
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print("Model uploaded")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

      - name: Save report as artifact (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.txt

      - name: Upload metrics.json to Cloud Storage (Bonus 4 history)
        run: |
          python - <<'EOF'
          from google.cloud import storage
          client = storage.Client()
          bucket = client.bucket("${{ secrets.CLOUD_BUCKET }}")
          blob = bucket.blob("models/latest/metrics.json")
          blob.upload_from_filename("outputs/metrics.json")
          print("Metrics uploaded for next-run comparison")
          EOF

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          import os
          acc_str = "${{ needs.train.outputs.accuracy }}"
          acc = float(acc_str)
          print(f"Accuracy = {acc}")
          if acc < 0.70:
              print(f"FAIL: accuracy {acc} < 0.70")
              raise SystemExit(1)
          print("PASS: accuracy >= 0.70")
          EOF

  # Bonus 2: validate ALL model types work (smoke test, not a deploy gate)
  # This proves the multi-model feature works without blocking the pipeline
  # if an individual model underperforms.
  validate_models:
    name: Validate Model Types (Bonus 2)
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test each model type (Bonus 2)
        run: |
          echo "=== Validating each model_type can be built (Bonus 2) ==="
          python - <<'EOF'
          import yaml
          from src.train import _build_model
          with open('params.yaml') as f:
              p = yaml.safe_load(f)
          results = []
          for mt in ['random_forest', 'gradient_boosting', 'logistic_regression', 'xgboost', 'voting']:
              try:
                  model = _build_model(mt, p)
                  results.append((mt, type(model).__name__, 'OK'))
              except Exception as e:
                  results.append((mt, 'N/A', f'FAIL: {e}'))
          print("")
          print("Model type validation:")
          for mt, cls, status in results:
              print(f"  {mt:25s} -> {cls:35s} {status}")
          ok = all(s == 'OK' for _, _, s in results)
          print("")
          print(f"Bonus 2: {'PASS - all 5 model types supported' if ok else 'PARTIAL - some models failed'}")
          # Always exit 0 - this is informational, not a gate
          EOF

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      # Bonus 4: rollback safety - compare new accuracy vs previous run's
      # We pull the previous metrics.json from Cloud Storage as a file, then compare locally.
      # This avoids needing google-cloud-storage in the deploy step.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies for rollback check
        run: pip install google-cloud-storage==2.16.0

      - name: Authenticate to Cloud Storage (for rollback fetch)
        run: |
          echo "${{ secrets.CLOUD_CREDENTIALS_B64 }}" | base64 -d > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Download metrics from train job
        uses: actions/download-artifact@v4
        with:
          name: metrics
          path: outputs

      - name: Rollback check (Bonus 4)
        env:
          BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          from google.cloud import storage
          import json, os
          client = storage.Client()
          bucket = client.bucket(os.environ["BUCKET"])
          # Read new accuracy from local metrics.json (always present, no env-var quirks)
          with open("outputs/metrics.json") as f:
              new_acc = float(json.load(f)["accuracy"])
          prev_blob = bucket.blob("models/latest/metrics.json")
          if not prev_blob.exists():
              print(f"No previous metrics found. Deploying new model (acc={new_acc:.4f})")
          else:
              prev = json.loads(prev_blob.download_as_text())
              prev_acc = prev.get("accuracy", 0.0)
              print(f"Previous accuracy: {prev_acc:.4f}")
              print(f"New accuracy:      {new_acc:.4f}")
              if new_acc < prev_acc:
                  print(f"ROLLBACK: new acc ({new_acc:.4f}) < prev acc ({prev_acc:.4f})")
                  raise SystemExit(1)
              print(f"PASS: new acc >= prev acc, safe to deploy")
          EOF

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 8
            echo "=== service status ==="
            sudo systemctl status mlops-serve --no-pager | head -30 || true
            echo "=== recent logs ==="
            sudo journalctl -u mlops-serve --no-pager -n 50 || true
            echo "=== port check ==="
            sudo ss -tlnp | grep 8000 || echo "port 8000 NOT listening"
            echo "=== curl health ==="
            curl -fv http://localhost:8000/health 2>&1 || echo "health check failed"
