name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo "${{ secrets.CLOUD_CREDENTIALS_B64 }}" | base64 -d > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          echo "Decoded file size:"
          wc -c /tmp/sa-key.json

      - name: Debug credentials
        run: |
          echo "=== File size ==="
          wc -c /tmp/sa-key.json
          echo "=== First 80 chars ==="
          head -c 80 /tmp/sa-key.json
          echo ""
          echo "=== Last 80 chars ==="
          tail -c 80 /tmp/sa-key.json
          echo ""
          echo "=== Check for backslash-escaped quotes ==="
          grep -c '\\"' /tmp/sa-key.json || echo "no escaped quotes found"
          echo "=== Check JSON validity ==="
          python -c "import json; d=json.load(open('/tmp/sa-key.json')); print('JSON OK'); print('client_email:', d['client_email']); print('private_key starts:', d['private_key'][:30])"
          echo "=== Test gcloud auth ==="
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json 2>&1 | head -5
          echo "=== Test GCS list ==="
          gcloud storage ls gs://day21vin/ 2>&1 | head -5

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          from google.cloud import storage
          client = storage.Client()
          bucket = client.bucket("${{ secrets.CLOUD_BUCKET }}")
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print("Model uploaded")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          import os
          acc_str = "${{ needs.train.outputs.accuracy }}"
          acc = float(acc_str)
          print(f"Accuracy = {acc}")
          if acc < 0.70:
              print(f"FAIL: accuracy {acc} < 0.70")
              raise SystemExit(1)
          print("PASS: accuracy >= 0.70")
          EOF

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 8
            echo "=== service status ==="
            sudo systemctl status mlops-serve --no-pager | head -30 || true
            echo "=== recent logs ==="
            sudo journalctl -u mlops-serve --no-pager -n 50 || true
            echo "=== port check ==="
            sudo ss -tlnp | grep 8000 || echo "port 8000 NOT listening"
            echo "=== curl health ==="
            curl -fv http://localhost:8000/health 2>&1 || echo "health check failed"
